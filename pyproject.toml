[project]
name = "cad-mcp"
version = "2.0.0"
description = "CAD MCP Server - 通过 MCP 控制 AutoCAD/浩辰CAD/中望CAD 进行绘图、查询、编辑与图纸管理"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.12,<2",
    "pywin32>=306",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
# 安装后可直接运行 cad-mcp 命令启动服务器
cad-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 保持原有 src 目录布局，兼容旧的 python src/server.py 启动方式
packages = ["src"]
